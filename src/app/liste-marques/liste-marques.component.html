<div class="container">
    <div class="card shadow mb-4">
        <div class="card-body">

            <div class="col-sm-4 col-md-4 col-lg-4 mb-4"> 
                <app-update-marque  [marque]="updatedMar"  
                                       (marqueUpdated)= "marqueUpdated($event)"
                                       [ajout]="ajout" >
                                       
                                    
               </app-update-marque>   
          </div>
        

            <table class="table table-striped">
                <thead>
                    <tr> <th>Id</th><th>Nom Marque</th> </tr>
                </thead>
             
             @for(cat of marques; track cat.idMar)
               {
                <tbody >
                    <tr>
                        <td>{{cat.idMar}}</td>
                        <td>{{cat.nomMar}}</td>
                        <td><a class="btn btn-success"  (click)="updateMar(cat)">Editer</a></td>
                     </tr>
                </tbody>
               }
            </table>
        </div>
    </div>
</div>
