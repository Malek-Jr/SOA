<div class="container">
    <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
        <label>Marques </label>
        <select class="form-control form-control-lg" id="idMar" name="idMar" [(ngModel)]="IdMarque"    (change)="onChange()">        
            @for(cat of marques;track cat.idMar) 
            {
                <option value="{{cat.idMar}}"> {{cat.nomMar}}  </option>
            }
        </select>                     
    </div>

    <div class="card shadow mb-4">                   
      <div class="card-body"> 
       <table class="table table-striped">
          <tr> <th>Id</th><th>Modele</th> <th>Prix</th> <th>Puissance</th>  <th>Date Fabrication</th> <th>Marque</th></tr>          
           @for (moto of motos; track moto.idMoto)
           {  
            <tbody >
              <tr >
                  <td>{{moto.idMoto}}</td>
                 <td>{{moto.modeleMoto}}</td>
                 <td>{{moto.prixMoto}}</td>
                 <td>{{moto.puissanceMoto}}</td>
                 <td>{{moto.dateFabrication | date:'dd/MM/yyyy'}}</td>
  
                 @if(moto.marque){ 
                  <td>{{moto.marque.nomMar}}</td>  }
                 @else {
                  <td>PAS DE MARQUE</td>
                  }
  <!-- 
                 <td><a class="btn btn-danger" (click)="supprimerProduit(produit)">Supprimer</a></td> 
                 <td><a class="btn btn-success" [routerLink]="['/updateProduit',produit.idProduit]">Modifier</a></td> -->
               </tr>                                    
            </tbody>
           }   
        
  
      </table>
      </div>
    </div>
  </div>
