<div class="container">
    <div>
      <h2>Ajouter une Moto :</h2>             
    </div>
         <form > 
         
             <div hidden class="col-sm-2 col-md-2 col-lg-2">
               <label >ID  Moto</label>
               <input   type="text"  [(ngModel)]="newMoto.idMoto"  
                   name="idMoto" class="form-control">
              </div>
         
             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Modele Moto</label>
               <input  type="text"[(ngModel)]= "newMoto.modeleMoto"  
                   name="modeleMoto" class="form-control">
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >Prix Moto</label>
               <input type="number"   [(ngModel)]= "newMoto.prixMoto"  
                   name="prixMoto" class="form-control">
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
              <label >Puissance Moto</label>
              <input type="number"   [(ngModel)]= "newMoto.puissanceMoto"  
                  name="puissanceMoto" class="form-control">
            </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
                 <label >Date <fieldset>fabrication</fieldset></label>
                 <input type="date"  [(ngModel)]= "newMoto.dateFabrication" 
                     name="dateFabrication" class="form-control">
             </div>

            <div class="col-sm-4 col-md-4 col-lg-4">
              <label>Marque</label>
            
              <select class="form-control form-control-lg" id="idMar" name="idMar" [(ngModel)]="newIdMar">
                 @for(cat of marques; track cat.idMar){
                   <option  [value]="cat.idMar">  {{cat.nomMar}}
                    </option>
                  }
              </select>
            </div>
         
              
       <div class="mt-2">
  <button type="submit" (click)="addMoto()"class="btn btn-success">Ajouter</button>
       </div>   

     
         </form>
</div>
